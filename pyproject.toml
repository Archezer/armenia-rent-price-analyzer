[project]
name = "price-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "playwright>=1.52.0",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
    "fastapi[standard]>=0.141.1",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "optuna>=4.9.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
